<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chat</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="app">

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo">
            Chat App
        </div>

        <button class="new-chat">
            + New Chat
        </button>
    </div>

    <!-- Main -->
    <div class="main">

        <!-- Messages -->
        <div id="messages" class="messages"></div>

        <!-- Input -->
        <div class="input-container">

            <textarea
                id="prompt"
                placeholder="Message AI..."
                rows="1"
            ></textarea>

            <button id="send-btn">
                Send
            </button>

        </div>

    </div>

</div>

<script src="/static/app.js"></script>

</body>
</html>
